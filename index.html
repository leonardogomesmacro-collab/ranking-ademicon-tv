<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ranking Ademicon</title>

<link rel="stylesheet" href="estilo.css">

</head>

<body>

<div class="container">

    <div class="left">

        <div class="logo-area">

            <img
                src="logo-ademicon.png.png"
                class="logo-ademicon"
                alt="Ademicon">

            <h2>RANKING DE VENDAS</h2>

        </div>

        <div class="podium">

            <div class="winner second" id="secondPlace"></div>

            <div class="winner first" id="firstPlace"></div>

            <div class="winner third" id="thirdPlace"></div>

        </div>

    </div>

    <div class="right">

        <div class="top-panel">

            <div class="top-title">
                TOP 10
            </div>

            <table>

                <thead>

                    <tr>
                        <th>POS.</th>
                        <th>CONSULTOR</th>
                        <th>VOLUME</th>
                    </tr>

                </thead>

                <tbody id="rankingTable">

                </tbody>

            </table>

        </div>

    </div>

</div>

<div class="footer-dashboard">

    <div class="footer-left">

        <div class="footer-item">
            🎯
            <span>FOCO NO OBJETIVO</span>
        </div>

        <div class="footer-item">
            🏆
            <span>DISCIPLINA TODO DIA</span>
        </div>

        <div class="footer-item">
            🚀
            <span>RESULTADOS EXTRAORDINÁRIOS</span>
        </div>

    </div>

    <div class="footer-right">

        JUNTOS,<br>
        SOMOS IMPARÁVEIS!

    </div>

</div>

<div class="footer-bottom">

    PLANEJE • CONQUISTE • REALIZE

</div>

<script src="app.js"></script>

</body>

</html>
