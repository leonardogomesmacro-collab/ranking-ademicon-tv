<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Ademicon | Ranking Anual
    </title>

    <link
        rel="stylesheet"
        href="tela3.css"
    >

</head>


<body>


<main class="annual-dashboard">


    <!-- =====================================================
         CABEÇALHO
         ===================================================== -->

    <header class="annual-header">

        <div class="brand">

            <img
                src="logo-ademicon.png.png"
                alt="Ademicon"
            >

            <span>
                Goiânia - Jardim Goiás
            </span>

        </div>


        <div class="annual-title">

            <div>
                RANKING
            </div>

            <div class="red">
                ANUAL
            </div>

            <p>
                RESULTADOS QUE CONSTROEM
                <strong>
                    GRANDES HISTÓRIAS.
                </strong>
            </p>

        </div>


        <div class="annual-status">

            <span class="status-dot"></span>

            <span id="status">
                Conectando...
            </span>

        </div>

    </header>


    <!-- =====================================================
         DESTAQUE
         ===================================================== -->

    <section class="annual-highlight">

        <div class="highlight-label">
            🏆 DESTAQUE DO ANO
        </div>

        <div class="highlight-position">
            1º
        </div>

        <div class="highlight-content">

            <span id="annualWinnerName">
                -
            </span>

            <strong id="annualWinnerValue">
                R$ -
            </strong>

        </div>

        <div class="highlight-message">
            PARABÉNS!
        </div>

    </section>


    <!-- =====================================================
         RANKING
         ===================================================== -->

    <section class="annual-ranking">


        <div class="ranking-header">

            <span>
                POS.
            </span>

            <span>
                CONSULTOR
            </span>

            <span>
                PRODUÇÃO ANUAL
            </span>

        </div>


        <div id="rankingAnualList"></div>


    </section>


    <!-- =====================================================
         FOOTER
         ===================================================== -->

    <footer>

        <span>
            GRANDES RESULTADOS SÃO CONSTRUÍDOS
            POR GRANDES ESCOLHAS.
        </span>

        <strong>
            SIGA EM FRENTE.
        </strong>

    </footer>


</main>


<!-- =====================================================
     STATUS
     ===================================================== -->

<div class="connection-status">

    <span class="status-dot"></span>

    <span id="statusFooter">
        Conectando...
    </span>

</div>


<!-- =====================================================
     NAVEGAÇÃO
     ===================================================== -->

<a
    href="tela2.html"
    class="screen-navigation screen-navigation-back"
>

    <b>
        ←
    </b>

    <span>
        TELA 2
    </span>

</a>


<a
    href="index.html"
    class="screen-navigation screen-navigation-next"
>

    <span>
        TELA 1
    </span>

    <b>
        →
    </b>

</a>


<script src="tela3.js"></script>


</body>

</html>
