<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Ademicon | Destaques da Semana
    </title>

    <link
        rel="stylesheet"
        href="tela2.css"
    >
</head>

<body>

    <main class="screen">

        <!-- HEADER -->

        <header class="header">

            <div class="brand">

                <div class="brand-mark">
                    ADEMICON
                </div>

                <div class="location">
                    Goiânia - Jardim Goiás
                </div>

            </div>


            <div class="status">

                <span class="status-dot"></span>

                <span id="status">
                    Conectando...
                </span>

            </div>

        </header>


        <!-- TÍTULO -->

        <section class="title-section">

            <div class="title-line"></div>

            <div>

                <h1>
                    DESTAQUES
                    <span>DA SEMANA</span>
                </h1>

                <p>
                    OS MELHORES, <strong>INSPIRAM TODOS.</strong>
                </p>

            </div>

        </section>


        <!-- CARDS -->

        <section class="highlights">


            <!-- RANKING SEMANA -->

            <article class="highlight-card semana">

                <div class="card-header">

                    <span class="slash">
                        /
                    </span>

                    <h2>
                        RANKING SEMANA
                    </h2>

                </div>


                <div class="position">
                    1º
                </div>


                <div class="photo-wrapper">

                    <img
                        id="fotoSemana"
                        src=""
                        alt="Consultor destaque da semana"
                    >

                </div>


                <h3 id="nomeSemana">
                    -
                </h3>


                <div
                    id="creditoSemana"
                    class="main-value"
                >
                    R$ -
                </div>


                <div class="description">
                    MAIOR CRÉDITO DA SEMANA
                </div>

            </article>


            <!-- RANKING CONTRATOS -->

            <article class="highlight-card contratos">

                <div class="card-header">

                    <span class="slash">
                        /
                    </span>

                    <h2>
                        RANKING CONTRATOS
                    </h2>

                </div>


                <div class="position">
                    1º
                </div>


                <div class="photo-wrapper">

                    <img
                        id="fotoContratos"
                        src=""
                        alt="Consultor destaque em contratos"
                    >

                </div>


                <h3 id="nomeContratos">
                    -
                </h3>


                <div
                    id="quantidadeContratos"
                    class="main-value"
                >
                    0 CONTRATOS
                </div>


                <div class="description">
                    MAIOR NÚMERO DE CONTRATOS
                </div>

            </article>

        </section>


        <!-- FOOTER -->

        <footer>

            <span>
                GRANDES RESULTADOS SÃO CONSTRUÍDOS
                POR GRANDES ESCOLHAS.
            </span>

            <strong>
                SIGA EM FRENTE.
            </strong>

        </footer>

    </main>


    <script src="tela2.js"></script>

</body>

</html>
